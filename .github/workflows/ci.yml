name: CI

on:
  push:
    branches: [main]
  pull_request:

# CI only reads the repo; never hand jobs a write-capable token.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: 1
      # Placeholder values so the build can run without real credentials.
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2xlcmsuZXhhbXBsZS5jb20k
      CLERK_SECRET_KEY: sk_test_placeholder
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Production dependencies only; accepted dev-tool advisories: docs/SECURITY.md.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  ai-service:
    # Pinned so a runner-image change cannot silently swap the Python build.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: ai-service/.python-version
          cache: pip
          cache-dependency-path: ai-service/requirements.txt
      - run: pip install -r requirements.txt
      - run: pip install pip-audit==2.10.1 && pip-audit -r requirements.txt
      # Fakes stand in for OpenAI and Pinecone, so no API keys are needed.
      - run: python -m pytest -q
